<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Support</title>

<style>

body{
  background:#050505;
  font-family:Arial;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

.support-box{
  width:600px;
  background:#111;
  padding:40px;
  border-radius:25px;
  border:1px solid #2a2a2a;
}

h1{
  text-align:center;
  margin-bottom:30px;
  color:red;
}

input,
textarea{
  width:100%;
  padding:18px;
  margin-bottom:20px;
  border:none;
  border-radius:14px;
  background:#1a1a1a;
  color:white;
  font-size:16px;
}

textarea{
  height:150px;
  resize:none;
}

button{
  width:100%;
  padding:18px;
  border:none;
  border-radius:14px;
  background:red;
  color:white;
  font-size:18px;
  cursor:pointer;
}

button:hover{
  background:#c40000;
}

</style>

</head>

<body>

<div class="support-box">

  <h1>Raise A Complaint</h1>

  <input 
    type="text"
    placeholder="Enter your name"
  >

  <input 
    type="email"
    placeholder="Enter your email"
  >

  <textarea 
    placeholder="Describe your issue..."
  ></textarea>

  <button>
    Submit Complaint
  </button>

</div>

</body>
</html>
